<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body{
            background-image: url(assets/WhatsApp\ Image\ 2026-11-02\ at\ 1.48.54\ PM.jpeg);
            height: 100vh;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>

<body>

    <div class="weather-container">

        <h1>Weather App 🌤️</h1>

        <p class="subtitle">
            Check the weather in your city
        </p>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button id="searchBtn">
                Search
            </button>
        </div>

        <p id="message" role="status" aria-live="polite"></p>

        <div id="weatherInfo" class="weather-info" hidden>

            <h2 id="cityName">City Name</h2>

            <div id="weatherIcon" class="weather-icon">
                🌤️
            </div>

            <h3 id="temperature">--°C</h3>

            <p id="description">Weather condition</p>

            <div class="weather-details">

                <div class="detail-box">
                    <span>💧</span>
                    <p>Humidity</p>
                    <h4 id="humidity">--%</h4>
                </div>

                <div class="detail-box">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <h4 id="windSpeed">-- km/h</h4>
                </div>

            </div>

        </div>

        <footer>
            <p>Made with ❤️ using HTML, CSS & JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
